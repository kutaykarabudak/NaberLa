<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaberLa Admin</title>
    <link rel="stylesheet" href="admin.css?v=920">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- DASHBOARD -->
    <div id="dashboard">
        <nav id="nav">
            <h1>NaberLa Admin</h1>
            <div>
                <a href="index.html" class="nav-btn">← Site</a>
            </div>
        </nav>

        <div id="panels">
            <!-- Pinterest Scanner -->
            <section class="panel purple">
                <h3>Pinterest Scraper</h3>
                <input type="text" id="inp-pin" placeholder="Pinterest board/pin URL (pin.it/xxx veya pinterest.com/user/board)">
                <label class="cb-label"><input type="checkbox" id="chk-clear" checked> Mevcut görselleri sil</label>
                <button id="btn-scan" class="action-btn purple-btn">Scan & Import</button>
                <div id="scan-bar-wrap" style="display:none;">
                    <div id="scan-bar"></div>
                </div>
                <p id="scan-msg" style="display:none;"></p>
            </section>

            <!-- Music -->
            <section class="panel">
                <h3 id="music-h">Playlist</h3>
                <div class="row">
                    <input type="text" id="inp-music" placeholder="YouTube or MP3 URL" class="flex1">
                    <button id="btn-add-music" class="action-btn">Add</button>
                </div>
                <ul id="music-list"></ul>
            </section>

            <!-- Images Table -->
            <section class="panel wide">
                <div class="row between">
                    <h3 id="img-h">Images</h3>
                    <select id="sort-sel">
                        <option value="">Default</option>
                        <option value="res">Resolution ↓</option>
                        <option value="w">Width ↓</option>
                        <option value="h">Height ↓</option>
                    </select>
                </div>
                <div class="row" style="margin-bottom:16px;">
                    <input type="text" id="inp-img" placeholder="Image URL" class="flex1">
                    <input type="text" id="inp-link" placeholder="Target link (optional)" class="flex1">
                    <button id="btn-add-img" class="action-btn">Add</button>
                </div>
                <div class="table-wrap">
                    <table id="img-table">
                        <thead><tr><th>Preview</th><th>File</th><th>Dimensions</th><th>Quality</th><th></th></tr></thead>
                        <tbody id="img-tbody"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>
    <script src="admin2.js?v=970"></script>
</body>
</html>
