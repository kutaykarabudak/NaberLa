<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaberLa - Admin Panel</title>
    <link rel="stylesheet" href="admin.css?v=20">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="login-container">
        <div class="login-box">
            <h2>Admin Login</h2>
            <input type="text" id="username" placeholder="Username" value="admin">
            <input type="password" id="password" placeholder="Password" value="123">
            <button id="login-btn">Login</button>
            <p id="login-error" class="error"></p>
        </div>
    </div>

    <div id="admin-dashboard" class="hidden">
        <header class="admin-header">
            <h1>NaberLa Admin</h1>
            <div>
                <a href="index.html" class="btn" style="margin-right:10px;">View Site</a>
                <button id="logout-btn" class="btn">Logout</button>
            </div>
        </header>

        <div class="admin-content" style="max-width: 1200px;">
            <section class="card" style="background:#1a1025; border:1px solid #8a2be2;">
                <h2 style="color:#d8b4fe;">Pinterest Auto-Scraper</h2>
                <div class="input-group" style="flex-direction:column; gap:10px;">
                    <input type="text" id="pinterest-url" placeholder="Paste Pinterest Board or Pin URL (e.g. https://pin.it/... or board link)">
                    <label style="color:#aaa; font-size:0.9rem; display:flex; align-items:center; gap:8px;">
                        <input type="checkbox" id="clear-existing" checked> Clear existing images before adding new ones
                    </label>
                    <button id="scan-btn" class="btn primary" style="background:#8a2be2;">Scan & Import</button>
                    
                    <div id="scan-progress-container" style="display:none; width:100%; background:#222; border-radius:4px; height:8px; overflow:hidden; margin-top:5px;">
                        <div id="scan-progress-bar" style="width:0%; height:100%; background:#8a2be2; transition:width 0.3s ease;"></div>
                    </div>
                    
                    <p id="scan-status" style="color:#d8b4fe; font-size:0.95rem; font-weight:bold; display:none; margin:0;">Scanning...</p>
                </div>
            </section>

            <section class="card">
                <h2 id="music-count-header">Playlist (MP3 or YouTube)</h2>
                <div class="input-group" style="flex-direction:row;">
                    <input type="text" id="new-music-url" placeholder="https://youtube.com/... or .mp3" style="flex:1;">
                    <button id="add-music-btn" class="btn primary">Add Song</button>
                </div>
                <ul id="music-list" class="item-list"></ul>
            </section>

            <section class="card" style="grid-column: span 2;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <h2 id="image-count-header" style="margin:0;">Image Feed Links (Dimension Table)</h2>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <label style="font-size:0.85rem; color:#aaa;">Sort By:</label>
                        <select id="sort-images-select" style="background:#0f172a; border:1px solid #334155; color:#fff; padding:6px 12px; border-radius:6px;">
                            <option value="default">Default Order</option>
                            <option value="res-desc">Resolution (Highest First)</option>
                            <option value="width-desc">Width (Widest First)</option>
                            <option value="height-desc">Height (Tallest First)</option>
                        </select>
                    </div>
                </div>

                <div class="input-group" style="flex-direction:row; gap:10px; margin-bottom:20px;">
                    <input type="text" id="new-image-url" placeholder="Image URL (https://...)" style="flex:2;">
                    <input type="text" id="new-target-url" placeholder="Target Link (https://pinterest.com/pin/...)" style="flex:2;">
                    <button id="add-image-btn" class="btn primary" style="flex:1;">Add Image</button>
                </div>

                <!-- Detailed Image Dimension Table -->
                <div style="overflow-x:auto;">
                    <table class="image-table" style="width:100%; border-collapse:collapse; text-align:left; font-size:0.85rem;">
                        <thead>
                            <tr style="background:#0f172a; border-bottom:2px solid #334155; color:#cbd5e1;">
                                <th style="padding:10px;">Preview</th>
                                <th style="padding:10px;">Image URL</th>
                                <th style="padding:10px;">Target Link</th>
                                <th style="padding:10px;">Dimensions</th>
                                <th style="padding:10px;">Quality Badge</th>
                                <th style="padding:10px; text-align:right;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="image-table-body">
                            <!-- Injected by JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>
    <script src="admin2.js?v=20"></script>
</body>
</html>
