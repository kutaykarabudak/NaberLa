<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaberLa - Admin Panel</title>
    <link rel="stylesheet" href="admin.css?v=700">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="login-container">
        <div class="login-box">
            <h2>Admin Login</h2>
            <input type="text" id="username" placeholder="Username" value="admin">
            <input type="password" id="password" placeholder="Password" value="123">
            <button id="login-btn">Login</button>
            <p id="login-error" class="error"></p>
        </div>
    </div>

    <div id="admin-dashboard" class="hidden">
        <header class="admin-header">
            <h1>NaberLa Admin</h1>
            <div>
                <a href="index.html" class="btn" style="margin-right:10px;">← View Site</a>
                <button id="logout-btn" class="btn">Logout</button>
            </div>
        </header>

        <div class="admin-content">
            <!-- Pinterest Scraper -->
            <section class="card" style="background:#1a1025; border:1px solid #8a2be2;">
                <h2 style="color:#d8b4fe;">Pinterest Auto-Scraper</h2>
                <div class="input-group" style="flex-direction:column; gap:10px;">
                    <input type="text" id="pinterest-url" placeholder="Pinterest Board/Pin URL (pin.it/xxx or pinterest.com/user/board)">
                    <label style="color:#aaa; font-size:0.85rem; display:flex; align-items:center; gap:8px;">
                        <input type="checkbox" id="clear-existing" checked> Replace existing images
                    </label>
                    <button id="scan-btn" class="btn primary" style="background:#8a2be2;">Scan & Import</button>
                    
                    <div id="scan-progress-container" style="display:none; width:100%; background:#222; border-radius:4px; height:8px; overflow:hidden; margin-top:5px;">
                        <div id="scan-progress-bar" style="width:0%; height:100%; background:linear-gradient(90deg, #8a2be2, #d8b4fe); transition:width 0.3s ease;"></div>
                    </div>
                    
                    <p id="scan-status" style="color:#d8b4fe; font-size:0.9rem; font-weight:bold; display:none; margin:0;">Scanning...</p>
                </div>
            </section>

            <!-- Music Playlist -->
            <section class="card">
                <h2 id="music-count-header">Playlist</h2>
                <div class="input-group" style="flex-direction:row;">
                    <input type="text" id="new-music-url" placeholder="YouTube URL or .mp3 link" style="flex:1;">
                    <button id="add-music-btn" class="btn primary">Add</button>
                </div>
                <ul id="music-list" class="item-list"></ul>
            </section>

            <!-- Image Dimension Table -->
            <section class="card" style="grid-column: span 2;">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:15px;">
                    <h2 id="image-count-header" style="margin:0; border:none; padding:0;">Image Feed</h2>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <select id="sort-images-select" style="background:#0f172a; border:1px solid #334155; color:#fff; padding:6px 12px; border-radius:6px; font-size:0.85rem;">
                            <option value="default">Default Order</option>
                            <option value="res-desc">Resolution ↓</option>
                            <option value="width-desc">Width ↓</option>
                            <option value="height-desc">Height ↓</option>
                        </select>
                    </div>
                </div>

                <div class="input-group" style="flex-direction:row; gap:10px; margin-bottom:20px;">
                    <input type="text" id="new-image-url" placeholder="Image URL" style="flex:2;">
                    <input type="text" id="new-target-url" placeholder="Target Link (optional)" style="flex:2;">
                    <button id="add-image-btn" class="btn primary">Add</button>
                </div>

                <div style="overflow-x:auto;">
                    <table class="image-table" style="width:100%; border-collapse:collapse; text-align:left; font-size:0.85rem;">
                        <thead>
                            <tr style="background:#0f172a; border-bottom:2px solid #334155; color:#94a3b8;">
                                <th style="padding:10px;">Preview</th>
                                <th style="padding:10px;">Filename</th>
                                <th style="padding:10px;">Dimensions</th>
                                <th style="padding:10px;">Quality</th>
                                <th style="padding:10px;">Grid Span</th>
                                <th style="padding:10px; text-align:right;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="image-table-body"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>
    <script src="admin2.js?v=700"></script>
</body>
</html>
