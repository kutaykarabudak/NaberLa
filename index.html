<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaberLa.co</title>
    <meta name="description" content="Curated visual feed with background music.">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="styles.css?v=915">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Custom Cursor (logo tip rotated to top-left) -->
    <div id="custom-cursor"><img src="assets/logo.png" alt=""></div>



    <!-- Start Overlay / Curtain -->
    <div id="overlay">
        <div id="overlay-inner">
            <h1 id="main-title">NABER <img src="assets/logo.png" alt="Logo" id="title-logo"> LA</h1>
            <button id="play-btn" aria-label="Play">
                <svg viewBox="0 0 24 24" width="64" height="64" fill="#e0af96"><polygon points="6,3 20,12 6,21"/></svg>
                <span class="ripple"></span>
                <span class="ripple r2"></span>
                <span class="ripple r3"></span>
            </button>
        </div>
    </div>

    <!-- Feed -->
    <main>
        <header id="top-bar">
            <div id="site-logo"><img src="assets/logo.png" alt="" style="height:30px"> NaberLa.co</div>
            <div>
                <button id="contact-open" class="hdr-btn">Contact</button>
            </div>
        </header>
        <section id="feed"></section>
    </main>

    <!-- YouTube Player (visible to API but invisible to user) -->
    <div id="yt-player" style="position:fixed;bottom:-200px;left:-200px;width:1px;height:1px;overflow:hidden;"></div>
    <audio id="html-audio"></audio>

    <!-- Player Bar -->
    <footer id="player-bar">
        <div id="p-left">
            <span id="song-title">Ready</span>
            <a id="yt-link" href="#" target="_blank" style="display:none;">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="#ef4444" stroke-width="2" fill="none"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19.08c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.33 29 29 0 0 0-.46-5.33z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"/></svg>
            </a>
        </div>
        <div id="p-center">
            <button id="btn-prev">⏮</button>
            <button id="btn-pp">▶</button>
            <button id="btn-next">⏭</button>
            <button id="btn-mute">🔊</button>
        </div>
        <div id="p-right">
            <button id="btn-scroll-pp" title="Pause/Resume Scroll">⏸</button>
            <input type="range" id="speed-slider" min="1" max="10" value="3" title="Scroll Speed">
        </div>
    </footer>

    <!-- Contact Modal -->
    <div id="contact-modal" class="modal-wrap" style="display:none;">
        <div class="modal-card">
            <button id="contact-close" class="close-x">&times;</button>
            <h2>Contact NaberLa</h2>
            <p>DJs, Models, or General Inquiries</p>
            <form id="contact-form">
                <input type="text" placeholder="Full Name" required>
                <input type="text" placeholder="Instagram or Email" required>
                <textarea placeholder="Your Message..." rows="4" required></textarea>
                <button type="submit" class="submit-btn">Send</button>
            </form>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="app.js?v=915"></script>
</body>
</html>
