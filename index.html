<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaberLa - Endless Vibe</title>
    <meta name="description" content="A continuous feed of curated posts with background house/trip music.">
    <link rel="stylesheet" href="styles.css?v=5">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
    <!-- Initial Overlay for Autoplay Policy -->
    <div id="start-overlay" class="overlay">
        <div class="overlay-content">
            <h1>NaberLa</h1>
            <p>Experience the vibe.</p>
        <button id="enter-btn" class="btn primary">ENTER NABERLA</button>
    </div>

    <!-- Main Container -->
    <main id="app">
        <header>
            <div class="logo">NaberLa.</div>
            <div>
                <button id="contact-btn" class="btn outline" style="margin-right: 15px;">Contact</button>
                <a href="https://github.com/kutaykarabudak/NaberLa" target="_blank" class="btn primary">GitHub</a>
            </div>
        </header>

        <section class="feed" id="feed-container">
            <!-- Posts will be injected here by JS -->
        </section>
        
        <div class="loading-indicator">
            <div class="spinner"></div>
        </div>
    </main>

    <!-- Hidden Players -->
    <div id="yt-player" class="hidden" style="display:none;"></div>
    <audio id="html-audio"></audio>

    <!-- Music Player Bar -->
    <div class="music-player-bar">
        <div class="player-info">
            <span id="current-song-title">Ready to play</span>
            <a id="yt-link" href="#" target="_blank" class="hidden" title="Listen on YouTube">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33 2.78 2.78 0 0 0 1.94 2c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.33 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></svg>
            </a>
        </div>
        
        <div class="player-center">
            <div class="player-controls">
                <button id="ctrl-prev" aria-label="Previous Track">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="currentColor" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
                </button>
                <button id="ctrl-playpause" aria-label="Play/Pause">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="currentColor" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                </button>
                <button id="ctrl-next" aria-label="Next Track">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="currentColor" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
                </button>
                <button id="ctrl-mute" aria-label="Mute/Unmute">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                </button>
            </div>
            <div class="player-progress">
                <span id="time-current">0:00</span>
                <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1">
                <span id="time-total">0:00</span>
            </div>
        </div>

        <div class="player-right">
            <div class="speed-control">
                <button id="ctrl-scroll-playpause" aria-label="Pause/Resume Scroll" class="scroll-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                </button>
                <input type="range" id="main-scroll-speed" min="1" max="10" value="3" title="Scroll Speed">
            </div>
        </div>
    </div>

    <!-- Contact Modal -->
    <div id="contact-modal" class="overlay hidden">
        <div class="modal-box">
            <button id="close-contact-btn" class="close-btn">&times;</button>
            <h2>Contact NaberLa</h2>
            <p>For DJs, Models, or General Inquiries</p>
            <form id="contact-form" class="input-group" style="flex-direction:column; gap:15px; margin-top:20px;">
                <input type="text" placeholder="Full Name" required>
                <input type="text" placeholder="Instagram or Email" required>
                <textarea placeholder="Your Message..." rows="4" required style="background:var(--input-bg); border:1px solid var(--glass-border); color:var(--text-primary); padding:12px; border-radius:8px; font-family:inherit; resize:none;"></textarea>
                <button type="submit" class="btn primary">Send Message</button>
            </form>
        </div>
    </div>

    <script src="app.js?v=5"></script>
</body>
</html>
