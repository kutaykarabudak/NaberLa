<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaberLa - Admin Panel</title>
    <link rel="stylesheet" href="admin.css?v=5">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="login-container">
        <div class="login-box">
            <h2>Admin Login</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button id="login-btn">Login</button>
            <p id="login-error" class="error"></p>
        </div>
    </div>

    <div id="admin-dashboard" class="hidden">
        <header class="admin-header">
            <h1>NaberLa Admin</h1>
            <a href="index.html" class="btn">View Site</a>
            <button id="logout-btn" class="btn">Logout</button>
        </header>

        <div class="admin-content">
            <section class="card">
                <h2>Playlist (MP3 or YouTube)</h2>
                <div class="input-group" style="flex-direction:row;">
                    <input type="text" id="new-music-url" placeholder="https://youtube.com/... or .mp3" style="flex:1;">
                    <button id="add-music-btn" class="btn primary">Add Song</button>
                </div>
                <ul id="music-list" class="item-list"></ul>
            </section>

            <section class="card">
                <h2>Image Feed Links</h2>
                <div class="input-group" style="flex-direction:column; gap:10px;">
                    <input type="text" id="new-image-url" placeholder="Image URL (e.g. assets/model1.jpg or https://...)">
                    <input type="text" id="new-target-url" placeholder="Target Link (e.g. https://instagram.com/profile)">
                    <button id="add-image-btn" class="btn primary">Add Image</button>
                </div>
                <ul id="image-list" class="item-list"></ul>
            </section>
        </div>
    </div>
    <script src="admin.js?v=5"></script>
</body>
</html>
